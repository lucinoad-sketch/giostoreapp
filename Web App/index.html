<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>GioStore</title>
<meta name="theme-color" content="#2b1466" id="tcm">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GioStore">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js">
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
<style>
:root{--blue:#8b5cff;--grad:linear-gradient(110deg,#ff3fa4,#8b5cff 50%,#2f6bff);--mut:#a89fc8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:#2b1466;overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:'Albert Sans',system-ui,sans-serif;background:#07040f;color:#fff;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;user-select:none;-webkit-user-select:none;overscroll-behavior-y:none;overflow-x:clip;touch-action:pan-x pan-y;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;box-shadow:0 0 0 1px #1a1038}
button{font-family:inherit}

/* Header */
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 24px) 0 28px;border-radius:0 0 38px 38px;overflow:hidden;
 background:radial-gradient(120% 90% at 0% 0%,rgba(255,63,164,.6),transparent 55%),radial-gradient(90% 120% at 100% 100%,rgba(47,107,255,.65),transparent 60%),linear-gradient(180deg,#2b1466,#120a30);
 border-bottom:1px solid rgba(190,150,255,.5);box-shadow:0 10px 30px rgba(139,92,255,.35)}
.top::before{content:"";position:absolute;inset:-60% -30%;background:conic-gradient(from 200deg at 30% 60%,transparent,rgba(255,100,200,.35),transparent 40%);opacity:.7;animation:swirl 16s linear infinite}
@keyframes swirl{to{transform:rotate(360deg)}}
.brand{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;animation:drop .8s cubic-bezier(.2,.8,.2,1) both}
.brand svg{width:38px;height:44px;color:#fff;--g:#2b1466;filter:drop-shadow(0 0 10px rgba(200,150,255,.55))}
.brand i{width:1px;height:38px;background:rgba(255,255,255,.55)}
.brand b{font-size:34px;font-weight:800;letter-spacing:.2px}
.brand b span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.handle{position:absolute;left:50%;bottom:9px;width:52px;height:5px;border-radius:5px;background:rgba(210,216,230,.75);transform:translateX(-50%)}
@keyframes drop{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}

/* Feed */
main{padding:22px 10px calc(165px + env(safe-area-inset-bottom))}
h1{font-size:22px;font-weight:700;padding:0 10px 14px}
.post{margin-bottom:26px;opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*.12s)}
.post.in{opacity:1;transform:none}
.who{display:flex;align-items:center;gap:14px;padding:0 4px 12px;font-size:17px;font-weight:500}
.av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#ff3fa4,#8b5cff 55%,#2f6bff);display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 0 14px rgba(139,92,255,.55)}
.ban{position:relative;aspect-ratio:1.75;border-radius:12px;overflow:hidden;display:flex;align-items:center;padding-left:7%;isolation:isolate}
.b1{background:radial-gradient(90% 80% at 10% 100%,#ff3fa4,transparent 60%),radial-gradient(70% 70% at 90% 0%,rgba(91,140,255,.45),transparent 60%),linear-gradient(135deg,#5a2bd6,#3b1fa8 55%,#2f6bff)}
.b2{background:radial-gradient(80% 80% at 10% 100%,#ff3fa4,transparent 60%),linear-gradient(135deg,#6a1bd1,#c2279f 55%,#ff3fa4)}
.ban::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.5s ease-in-out 1.2s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.bt{flex:1;z-index:1}
.bt h2{font-size:clamp(46px,16vw,70px);line-height:1;font-weight:700;letter-spacing:-1px}
.bt h2.sm{font-size:clamp(34px,11.5vw,52px);font-weight:800;letter-spacing:0}
.bt p{font-size:clamp(11px,3.3vw,15px);letter-spacing:.28em;font-weight:600;color:#eadcff;margin-top:8px}
.b2 .bt p{color:#f1d2ff}
.ph{position:relative;z-index:1;width:26%;aspect-ratio:.55;margin:0 7% 0 auto;border:2px solid #c9b0ff;border-radius:20px;background:#140b2c;padding:9px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 22px rgba(180,130,255,.75),inset 0 0 12px rgba(180,130,255,.35);animation:fl 5s ease-in-out infinite}
.b2 .ph{border-color:#ffb3dc;box-shadow:0 0 22px rgba(255,90,180,.75),inset 0 0 12px rgba(255,90,180,.35);animation-delay:-2s}
.ph .bar{height:22%;border-radius:8px;background:#3b2f6b}
.ph .g{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ph .g i{border-radius:7px;background:#3e3270;animation:pulse 2.4s ease-in-out infinite}
.ph .g i:nth-child(2){animation-delay:.3s}.ph .g i:nth-child(3){animation-delay:.6s}.ph .g i:nth-child(4){animation-delay:.9s}
.ph .dots{display:flex;justify-content:center;gap:6px;height:7px}
.ph .dots span{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1.8s infinite}
.ph .dots span:nth-child(2){animation-delay:.25s}.ph .dots span:nth-child(3){animation-delay:.5s}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes pulse{50%{background:#8a6cf0}}
@keyframes blink{50%{opacity:.3}}
.post h3{font-size:19px;font-weight:700;margin:18px 4px 8px;line-height:1.25}
.desc{font-size:16px;line-height:1.45;color:#c4cad8;margin:0 4px}
.post time{display:block;text-align:right;color:#7d869b;font-size:15px;margin:12px 6px 0}
.view.enter{animation:vin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateX(calc(var(--dir,1)*36px))}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
@keyframes icin{from{opacity:0;transform:scale(.5)}}
@keyframes ring{from{transform:scale(.85);opacity:.9}to{transform:scale(1.55);opacity:0}}
.soon{text-align:center;padding:70px 24px;color:var(--mut)}
.soon .ic{position:relative;width:104px;height:104px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,rgba(139,92,255,.3),transparent 70%);animation:icin .6s cubic-bezier(.3,1.5,.5,1) both,fl 3.2s ease-in-out .6s infinite}
.soon .ic::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(190,120,255,.55);animation:ring 2.4s ease-out infinite}
.soon .ic i{font-size:44px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 12px rgba(190,100,255,.7))}
.soon h2{color:#fff;margin-bottom:8px;font-size:26px}
.soon p{font-size:16px;line-height:1.5;max-width:300px;margin:0 auto}
.soon .chip{display:inline-block;margin-top:20px;padding:7px 16px;border-radius:999px;font-size:13px;font-weight:600;color:#e6d8ff;background:rgba(139,92,255,.2);border:1px solid rgba(180,140,255,.4)}
.view.enter .soon>:not(.ic){animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.soon>h2{animation-delay:.1s!important}.soon>p{animation-delay:.18s!important}.soon>.chip{animation-delay:.26s!important}

/* Biblioteca (pestaña Apps) */
.lib{padding:0 8px}
.seg{position:relative;display:inline-flex;gap:2px;margin:2px 0 20px}
.seg button{position:relative;z-index:1;border:0;background:none;color:#b9aedd;font-size:17px;font-weight:600;padding:13px 20px;border-radius:999px;cursor:pointer;transition:color .3s}
.seg button.on{color:#fff}
.pill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:999px;background:linear-gradient(110deg,rgba(255,63,164,.22),rgba(139,92,255,.32) 55%,rgba(47,107,255,.26));border:1px solid rgba(190,150,255,.5);box-shadow:0 0 18px rgba(139,92,255,.35),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .45s cubic-bezier(.3,1.3,.5,1)}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{position:relative;display:block;width:100%;aspect-ratio:1;padding:0;border:0;border-radius:10px;overflow:hidden;cursor:pointer;background:#140b2c;box-shadow:0 0 0 1px rgba(190,150,255,.16),0 8px 20px rgba(0,0,0,.45);transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .25s;animation:cin .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--n)*.06s)}
.card:active{transform:scale(.95);box-shadow:0 0 0 1px rgba(190,150,255,.65),0 0 24px rgba(139,92,255,.55)}
.card img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
@keyframes cin{from{opacity:0;transform:translateY(16px) scale(.92)}}
.card .gt{position:absolute;inset:0;display:grid;place-items:center;padding:14px;text-align:center;font-weight:800;font-size:clamp(16px,5.2vw,22px);line-height:1.15;letter-spacing:.01em;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.card::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 20% 0,rgba(255,255,255,.16),transparent 55%);pointer-events:none}
.card.p1,.dhero.p1{background:linear-gradient(160deg,#6d7a63,#262d26)}
.card.p2,.dhero.p2{background:linear-gradient(160deg,#7a2f2f,#0f1d24)}
.card.p3,.dhero.p3{background:linear-gradient(160deg,#ff3fa4,#3a1d8f 60%,#150a3c)}
.card.p4,.dhero.p4{background:linear-gradient(160deg,#2fd4ff,#6b3bd1 60%,#1a0f3a)}
.card.p5,.dhero.p5{background:linear-gradient(160deg,#3fa9ff,#2f8f4a 80%)}
.card.p6,.dhero.p6{background:linear-gradient(160deg,#ff9a2f,#2f6bff)}
.card.wipe,.dhero.wipe{background:linear-gradient(180deg,#f8f8fa 0,#eceef3 50%,#1b2542 100%)}
.wp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:26%}
.wp b{font-size:clamp(26px,9vw,40px);font-style:italic;font-weight:800;letter-spacing:-1px;color:#e0132c;line-height:1}
.wp small{margin-top:7px;font-size:9px;letter-spacing:.2em;font-weight:700;color:#59607a}
.wp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;background:radial-gradient(ellipse at 65% 100%,rgba(74,168,255,.85),transparent 62%),linear-gradient(180deg,transparent,#0f1730)}
.card.gold,.dhero.gold{background:radial-gradient(circle at 50% 68%,#fff3bd 0,#f6cf72 30%,#e2a54a 62%,#b9742b 100%)}
.sun{position:absolute;left:50%;top:62%;width:70%;aspect-ratio:1;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,255,235,.95),rgba(255,240,170,0) 70%)}
.dune{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(180deg,#a8662a,#5e3414);clip-path:polygon(0 100%,0 72%,28% 58%,50% 18%,72% 58%,100% 74%,100% 100%)}

/* Detalle de juego */
.det{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:480px;z-index:50;background:#07040f;box-shadow:-26px 0 50px rgba(0,0,0,.6),0 0 0 1px #1a1038;will-change:transform}
.scrim{position:fixed;inset:0;z-index:49;background:rgba(4,2,12,.78);opacity:0;pointer-events:none;transition:opacity .45s ease}
body.dopen .scrim{opacity:1}
main,.top{transform-origin:50% 35%;transition:transform .55s cubic-bezier(.22,1,.3,1),filter .55s ease}
body.dopen main,body.dopen .top{transform:scale(.93);filter:brightness(.55) saturate(.9)}
body.dclose main,body.dclose .top{transition-duration:.4s}
.det.in{animation:din .55s cubic-bezier(.22,1,.3,1) both}
.det.out{animation:dout .4s cubic-bezier(.5,0,.75,.2) both}
@keyframes din{from{transform:translateX(100%)}}
@keyframes dout{from{transform:translateX(var(--dx,0px))}to{transform:translateX(104%)}}
.det.in .dinfo{animation:rise .6s cubic-bezier(.2,.8,.2,1) .12s backwards}
.det.in .dback{animation:bin .5s cubic-bezier(.3,1.5,.5,1) .3s backwards}
@keyframes bin{from{opacity:0;transform:scale(.4)}}
.det.out .dsc{animation:dfade .4s ease both}
@keyframes dfade{to{opacity:.35;transform:translateX(-5%)}}
.det.out .dback{animation:bout .18s ease both}
@keyframes bout{to{opacity:0;transform:scale(.5)}}
.dsc{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.dhero{position:relative;width:100%;aspect-ratio:16/11;overflow:hidden}
.dhero::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(70% 90% at 80% 15%,rgba(255,255,255,.24),transparent 60%),radial-gradient(60% 80% at 8% 95%,rgba(0,0,0,.38),transparent 70%);pointer-events:none}
.dhero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:42%;z-index:2;background:linear-gradient(180deg,transparent,#1d1043);pointer-events:none}
.dinfo{position:relative;z-index:3;margin-top:-1px;padding:20px 22px 26px;border-radius:0 0 36px 36px;background:linear-gradient(180deg,#1d1043,#130a31);border-bottom:1px solid rgba(190,150,255,.5);box-shadow:0 10px 30px rgba(139,92,255,.3)}
.dinfo h2{font-size:27px;font-weight:700;line-height:1.15}
.dinfo p{margin-top:6px;font-size:15px;color:var(--mut)}
.dseg{margin:20px 0 0 -4px}
.dpane{display:flex;flex-direction:column;gap:18px;padding:24px 18px 0}
.dpane>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.dpane>:nth-child(1){animation-delay:.08s}.dpane>:nth-child(2){animation-delay:.16s}.dpane>:nth-child(3){animation-delay:.24s}.dpane>:nth-child(4){animation-delay:.32s}
.gd{padding:18px 18px 20px;border-radius:16px;background:rgba(20,11,44,.75);border:1px solid rgba(190,150,255,.2)}
.gd h4{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:10px}
.gd p{font-size:16px;line-height:1.6;color:#d8d2ee}
.plat{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:16px 18px;border-radius:14px;color:#fff;cursor:pointer;background:rgba(139,92,255,.08);border:1px solid rgba(190,150,255,.38);transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .25s,border-color .25s}
.plat:active{transform:scale(.98);background:rgba(139,92,255,.18);border-color:rgba(190,150,255,.7)}
.plat b{display:block;font-size:20px;font-weight:600}
.plat small{display:block;margin-top:3px;font-size:13px;color:var(--mut)}
.plat svg{flex:none;width:22px;height:22px}
.dl{padding:18px 16px 16px;border-radius:16px;background:rgba(20,11,44,.75);border:1px solid rgba(190,150,255,.2)}
.dl p{margin-top:14px;font-size:14px;color:var(--mut)}
.dl p b{color:#5b8cff;font-weight:700}
.dlbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:54px;position:relative;overflow:hidden;border:1px solid transparent;border-radius:999px;background:var(--grad);color:#fff;font-size:17px;font-weight:700;cursor:pointer;box-shadow:0 8px 26px rgba(139,92,255,.45),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .3s}
.dlbtn:active{transform:scale(.97)}
.dlw{position:relative}
.pulse{position:absolute;inset:0;border-radius:999px;pointer-events:none}
.dlw.go .pulse{animation:rg 1s ease-out}
@keyframes rg{from{box-shadow:0 0 0 0 rgba(47,155,255,.65)}to{box-shadow:0 0 0 22px rgba(47,155,255,0)}}
.dlbtn .fill{display:none;position:absolute;inset:0;overflow:hidden;background:var(--grad);clip-path:inset(0 calc((1 - var(--p,0))*100%) 0 0)}
.dlbtn .fill::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,rgba(255,255,255,.4) 50%,transparent 65%);transform:translateX(-100%);animation:shn 1.1s linear infinite}
@keyframes shn{to{transform:translateX(100%)}}
.dlbtn.run{background:rgba(139,92,255,.16);border-color:rgba(190,150,255,.45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03);cursor:default}
.dlbtn.run .fill{display:block}
.dlbtn.run:active,.dlbtn.ok:active{transform:none}
.dlbtn.ok{background:var(--grad);box-shadow:0 8px 28px rgba(139,92,255,.5),inset 0 1px 0 rgba(255,255,255,.3);cursor:default}
.lab{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:10px}
.lab .l.sw,.st.sw{animation:lsw .38s cubic-bezier(.2,.8,.2,1)}
@keyframes lsw{from{opacity:0;transform:translateY(8px)}}
.pc{display:none;min-width:3.2ch;text-align:left;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;opacity:.92}
.dlbtn.run .pc{display:inline}
.ck{display:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.24);place-items:center}
.dlbtn.ok .ck{display:grid;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.ck svg{display:block;width:15px;height:15px}
.ck path{stroke-dasharray:1;stroke-dashoffset:1}
.dlbtn.ok .ck path{animation:draw .4s .14s ease-out forwards}
@keyframes pop{from{transform:scale(.3);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.np{display:flex;align-items:center;gap:12px;padding:4px 14px;font-size:17px;color:#e6e0ff}
.np svg{width:22px;height:22px;color:var(--mut)}
.dpane .soon{padding:36px 10px}
.dpane .soon .ic svg{width:44px;height:44px;filter:drop-shadow(0 0 12px rgba(190,100,255,.7))}
.dpane .soon h2{font-size:22px}
.dback{position:absolute;left:16px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:5;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;cursor:pointer;background:rgba(28,16,62,.88);border:1px solid rgba(190,150,255,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 6px 22px rgba(0,0,0,.5),0 0 18px rgba(139,92,255,.45);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.dback:active{transform:scale(.88)}
.dback svg{width:24px;height:24px}

/* Explorar (tienda) */
.ex{padding:0 4px}
.exh{display:flex;align-items:center;gap:12px;margin:0 6px 20px}
.sbag{width:34px;height:40px;color:#fff;--g:#2b1466;filter:drop-shadow(0 0 10px rgba(200,150,255,.5))}
.exh b{flex:1;font-size:21px;font-weight:600}
.exh b span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.hmb{width:42px;height:42px;display:grid;place-items:center;border:0;border-radius:50%;background:none;color:#fff;cursor:pointer;transition:background .25s,transform .25s cubic-bezier(.3,1.5,.5,1)}
.hmb:active{background:rgba(139,92,255,.25);transform:scale(.88)}
.hmb svg{width:24px;height:24px}
.chips{display:flex;width:100%;margin:0 0 18px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;white-space:nowrap}
.chips .pill{box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.exb>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
.exb>:nth-child(2){animation-delay:.07s}.exb>:nth-child(3){animation-delay:.14s}.exb>:nth-child(4){animation-delay:.21s}.exb>:nth-child(5){animation-delay:.28s}.exb>:nth-child(6){animation-delay:.34s}

const LISTS={
 get bought(){return Object.keys(LIB).filter(k=>GAMES[k]&&LIB[k].b).sort((a,b)=>LIB[b].b-LIB[a].b)},
 get down(){return Object.keys(LIB).filter(k=>GAMES[k]&&LIB[k].d).sort((a,b)=>LIB[b].d-LIB[a].d)}};

const fdate=t=>new Date(t).toLocaleDateString('es',{day:'2-digit',month:'2-digit',year:'numeric'});
function libMark(k,f){
  if(!LIBU||!GAMES[k])return;
  const now=Date.now();LIB[k]=LIB[k]||{b:0,d:0};
  if(f==='d'&&!LIB[k].b)LIB[k].b=now;
  LIB[k][f]=now;
  LSs(libKey(),JSON.stringify(LIB));

}
function paintLibViews(){const sg=libSig();if(sg===lsig)return;lsig=sg;if(cur===3)libShow();if(mopen)menuLib()}

  LIBU=u.uid;LIB=libLocal();paintLibViews();

    const r=(await GSA.lib())||{},keys=new Set([...Object.keys(LIB),...Object.keys(r)]),out={},push=[];
    keys.forEach(k=>{if(!GAMES[k])return;
      const a=LIB[k]||{},c=r[k]||{},m=(x,y)=>x&&y?Math.min(x,y):(x||y||0);
      const n={b:m(a.b,c.b),d:Math.max(a.d||0,c.d||0)};out[k]=n;
      if(n.b!==(c.b||0)||n.d!==(c.d||0))push.push([k,n])});
    if(LIBU!==u.uid)return;
    LIB=out;LSs(libKey(),JSON.stringify(LIB));paintLibViews();
    push.forEach(([k,n])=>GSA.setLib(k,n).catch(()=>{}));
  }catch(e){console.warn('Biblioteca:',e&&e.code||e)}
}

 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M4.5 12.5l5 5L19.5 7"/></svg>'

let cvT=0;function cover(on){clearTimeout(cvT);if(on)cvT=setTimeout(()=>document.body.classList.add('cover'),650);else document.body.classList.remove('cover')}
function dlInner(k){
  if(!owned(k))return '<div class="dlw"><button class="dlbtn get"><span class="lab"><i class="fa-solid fa-bag-shopping"></i><span class="l">Obtener gratis</span></span></button><i class="pulse"></i></div><p class="st">Obtén el juego para guardarlo en tu cuenta y poder descargarlo.</p>';

  if(btn.dataset.s)return;btn.dataset.s='1';

     '<div class="seg dseg" role="tablist"><i class="pill"></i><button class="on" role="tab" data-p="about">Acerca de</button><button role="tab" data-p="addons">Complementos</button></div></div>'+

   '<div class="dpane" data-p="addons" hidden><div class="soon"><div class="ic"><svg viewBox="0 0 24 24" fill="url(#brand)"><path d="M20.5 11H19V7c0-1.1-.9-2-2-2h-4V3.5C13 2.12 11.88 1 10.5 1S8 2.12 8 3.5V5H4c-1.1 0-2 .9-2 2v3.8h1.5c1.49 0 2.7 1.21 2.7 2.7s-1.21 2.7-2.7 2.7H2V20c0 1.1.9 2 2 2h3.8v-1.5c0-1.49 1.21-2.7 2.7-2.7s2.7 1.21 2.7 2.7V22H17c1.1 0 2-.9 2-2v-4h1.5c1.38 0 2.5-1.12 2.5-2.5S21.88 11 20.5 11z"/></svg></div><h2>Próximamente</h2><p>Los complementos de este juego llegarán muy pronto.</p><span class="chip">Muy pronto</span></div></div>';
  det.style.animation='';det.style.transform='';det.style.transition='';det.style.setProperty('--dx','0px');
  document.body.classList.remove('dclose');document.body.classList.add('dopen');

function closeDet(pop){
  if(det.hidden||det.classList.contains('out'))return;

function swap(el,html){el.innerHTML=html;el.classList.remove('sw');void el.offsetWidth;el.classList.add('sw')}
function runDl(d){
  if(d.dataset.s)return;d.dataset.s='1';const gk=cg;
  {const u=GAMES[gk]&&GAMES[gk].url;if(u){const a=document.createElement('a');a.href=u;a.rel='noopener';a.target='_blank';a.download='';document.body.append(a);a.click();a.remove()}}

  if(navigator.vibrate)navigator.vibrate(14);
  (function tick(now){
    const t=Math.min(1,(now-t0)/T),p=t<.5?2*t*t:1-Math.pow(2-2*t,2)/2;
    d.style.setProperty('--p',p);pc.textContent=Math.floor(p*100)+'%';

    swap(l,'Listo en tu dispositivo');libMark(gk,'d');const stp=d.closest('.dl'),stl=stp&&stp.querySelector('.st');if(stl)stl.innerHTML='Dispositivo vinculado: <b>Conectado</b><br>Última descarga: '+fdate(Date.now());
    if(navigator.vibrate)navigator.vibrate([12,50,12]);
    setTimeout(()=>{d.classList.remove('ok');w.classList.remove('go');swap(l,'Descargar al dispositivo');delete d.dataset.s},3400);
  })(t0);

    const base={name:d.name,email:d.email,photo:d.photo,provider:d.provider,lastLogin:Date.now()};
