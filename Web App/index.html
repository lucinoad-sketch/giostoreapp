<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GioStore</title>
<meta name="theme-color" content="#05070f">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GioStore">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--blue:#2f8bff;--mut:#9aa3b8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:#000;overscroll-behavior:none}
body{font-family:'Albert Sans',system-ui,sans-serif;background:#04060e;color:#fff;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;user-select:none;-webkit-user-select:none;overscroll-behavior-y:none;overflow-x:clip;touch-action:manipulation;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;box-shadow:0 0 0 1px #0d1226}
button{font-family:inherit}

/* Header */
.top{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 24px) 0 28px;border-radius:0 0 38px 38px;overflow:hidden;
 background:radial-gradient(120% 90% at 0% 0%,#1b5cff,transparent 55%),radial-gradient(90% 120% at 100% 100%,#0a3bd0,transparent 60%),linear-gradient(180deg,#0a1b5c,#061033);
 border-bottom:1px solid rgba(110,160,255,.45);box-shadow:0 10px 30px rgba(20,90,255,.28)}
.top::before{content:"";position:absolute;inset:-60% -30%;background:conic-gradient(from 200deg at 30% 60%,transparent,rgba(60,140,255,.4),transparent 40%);opacity:.7;animation:swirl 16s linear infinite}
@keyframes swirl{to{transform:rotate(360deg)}}
.brand{position:relative;display:flex;align-items:center;justify-content:center;gap:16px;animation:drop .8s cubic-bezier(.2,.8,.2,1) both}
.brand svg{width:38px;height:44px;color:#fff;--g:#0a1b5c;filter:drop-shadow(0 0 10px rgba(120,180,255,.5))}
.brand i{width:1px;height:38px;background:rgba(255,255,255,.55)}
.brand b{font-size:34px;font-weight:800;letter-spacing:.2px}
.brand b span{color:var(--blue)}
.handle{position:absolute;left:50%;bottom:9px;width:52px;height:5px;border-radius:5px;background:rgba(210,216,230,.75);transform:translateX(-50%)}
@keyframes drop{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}

/* Feed */
main{padding:22px 10px calc(150px + env(safe-area-inset-bottom))}
h1{font-size:22px;font-weight:700;padding:0 10px 14px}
.post{margin-bottom:26px;opacity:0;transform:translateY(34px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i)*.12s)}
.post.in{opacity:1;transform:none}
.who{display:flex;align-items:center;gap:14px;padding:0 4px 12px;font-size:17px;font-weight:500}
.av{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2b8cff,#0b49e0);display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 0 14px rgba(40,120,255,.5)}
.ban{position:relative;aspect-ratio:1.75;border-radius:12px;overflow:hidden;display:flex;align-items:center;padding-left:7%;isolation:isolate}
.b1{background:radial-gradient(90% 80% at 10% 100%,#0a6bff,transparent 60%),radial-gradient(70% 70% at 90% 0%,rgba(29,139,255,.35),transparent 60%),linear-gradient(135deg,#0a35c9,#0a2799 55%,#0b4fe8)}
.b2{background:radial-gradient(80% 80% at 10% 100%,#d21df0,transparent 60%),linear-gradient(135deg,#4a0fb8,#8a1aea 50%,#c61df0)}
.ban::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-120%);animation:shine 4.5s ease-in-out 1.2s infinite}
@keyframes shine{60%,100%{transform:translateX(120%)}}
.bt{flex:1;z-index:1}
.bt h2{font-size:clamp(46px,16vw,70px);line-height:1;font-weight:700;letter-spacing:-1px}
.bt h2.sm{font-size:clamp(34px,11.5vw,52px);font-weight:800;letter-spacing:0}
.bt p{font-size:clamp(11px,3.3vw,15px);letter-spacing:.28em;font-weight:600;color:#cfe1ff;margin-top:8px}
.b2 .bt p{color:#f1d2ff}
.ph{position:relative;z-index:1;width:26%;aspect-ratio:.55;margin:0 7% 0 auto;border:2px solid #8cc4ff;border-radius:20px;background:#0b1128;padding:9px 8px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 22px rgba(90,170,255,.75),inset 0 0 12px rgba(90,170,255,.35);animation:fl 5s ease-in-out infinite}
.b2 .ph{border-color:#e6b4ff;box-shadow:0 0 22px rgba(230,120,255,.75),inset 0 0 12px rgba(230,120,255,.35);animation-delay:-2s}
.ph .bar{height:22%;border-radius:8px;background:#3a3e4b}
.ph .g{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ph .g i{border-radius:7px;background:#3d414e;animation:pulse 2.4s ease-in-out infinite}
.ph .g i:nth-child(2){animation-delay:.3s}.ph .g i:nth-child(3){animation-delay:.6s}.ph .g i:nth-child(4){animation-delay:.9s}
.ph .dots{display:flex;justify-content:center;gap:6px;height:7px}
.ph .dots span{width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1.8s infinite}
.ph .dots span:nth-child(2){animation-delay:.25s}.ph .dots span:nth-child(3){animation-delay:.5s}
@keyframes fl{50%{transform:translateY(-6px)}}
@keyframes pulse{50%{background:#5a74ad}}
@keyframes blink{50%{opacity:.3}}
.post h3{font-size:19px;font-weight:700;margin:18px 4px 8px;line-height:1.25}
.desc{font-size:16px;line-height:1.45;color:#c4cad8;margin:0 4px}
.post time{display:block;text-align:right;color:#7d869b;font-size:15px;margin:12px 6px 0}
.soon{text-align:center;padding:90px 20px;color:var(--mut)}
.soon i{font-size:46px;color:var(--blue);animation:fl 3s ease-in-out infinite}
.soon h2{color:#fff;margin:18px 0 6px;font-size:24px}

/* Barra inferior */
.nav{--i:2;position:fixed;bottom:0;left:50%;width:min(100%,480px);height:calc(116px + env(safe-area-inset-bottom));z-index:30;border-radius:44px 44px 0 0;
 background:linear-gradient(180deg,#0c1431,#060a1a);border-top:1px solid rgba(110,160,255,.4);box-shadow:0 -8px 30px rgba(10,50,160,.35);
 transform:translateX(-50%) translateY(100%);animation:up .8s cubic-bezier(.2,.8,.2,1) .35s forwards}
@keyframes up{to{transform:translateX(-50%)}}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);padding-top:20px}
.tab{background:none;border:0;color:#fff;height:46px;display:grid;place-items:center;font-size:30px;cursor:pointer;transition:transform .3s cubic-bezier(.3,1.6,.5,1),color .25s}
.tab:active{transform:scale(.8)}
.tab.on{color:var(--blue);transform:scale(1.14)}
.tab svg{width:34px;height:38px;--g:#060a1a}
.ind{position:absolute;top:72px;left:calc(var(--i)*20% + 10%);width:40px;height:3px;border-radius:3px;background:var(--blue);box-shadow:0 0 12px var(--blue);transform:translateX(-50%);transition:left .45s cubic-bezier(.3,1.3,.5,1)}
.lbl{position:absolute;top:84px;left:calc(var(--i)*20% + 10%);transform:translateX(-50%);font-size:16px;font-weight:500;white-space:nowrap;transition:left .45s cubic-bezier(.3,1.3,.5,1)}
.lbl.pop{animation:pop .35s ease both}
@keyframes pop{from{opacity:0;margin-top:6px}to{opacity:1;margin-top:0}}
.install{position:fixed;left:50%;bottom:calc(128px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(92%,440px);z-index:25;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:rgba(14,22,52,.96);border:1px solid rgba(110,160,255,.4);box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:14px;animation:pill .5s cubic-bezier(.2,.8,.2,1) both}
.install>i{color:var(--blue);font-size:18px}
.install span{flex:1;line-height:1.3}
.install button{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;background:var(--blue);color:#fff;cursor:pointer}
.install #ix{background:none;color:var(--mut);font-size:22px;padding:0 4px;line-height:1}
@keyframes pill{from{opacity:0;transform:translateX(-50%) translateY(14px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.post{opacity:1;transform:none}.nav{transform:translateX(-50%)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="bag" viewBox="0 0 48 56"><path d="M17 16v-3a7 7 0 0 1 14 0v3" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M6 17h36l2.5 30a6 6 0 0 1-6 6.5H9.500A6 6 0 0 1 3.500 47z" fill="currentColor"/><text x="24" y="45" text-anchor="middle" font-family="Albert Sans,Arial,sans-serif" font-weight="800" font-size="27" fill="var(--g)">G</text></symbol></svg>

<header class="top">
  <div class="brand"><svg><use href="#bag"/></svg><i></i><b>Gio<span>Store</span></b></div>
  <div class="handle"></div>
</header>

<main>
  <section id="home">
    <h1>Noticias oficiales</h1>
    <div id="feed"></div>
  </section>
  <section id="soon" hidden><div class="soon"><i class="fa-solid fa-rocket"></i><h2 id="sn"></h2><p>Esta sección llega pronto.</p></div></section>
</main>

<div class="install" id="install" hidden><i class="fa-solid fa-download"></i><span id="itxt">Instala GioStore en tu celular</span><button id="ibtn">Instalar</button><button id="ix" aria-label="Cerrar">&times;</button></div>

<nav class="nav" id="nav" aria-label="Principal">
  <div class="tabs">
    <button class="tab" aria-label="Juegos"><i class="fa-solid fa-gamepad"></i></button>
    <button class="tab" aria-label="Novedades"><i class="fa-solid fa-rocket"></i></button>
    <button class="tab on" aria-label="Explorar"><svg><use href="#bag"/></svg></button>
    <button class="tab" aria-label="Apps"><i class="fa-solid fa-grip"></i></button>
    <button class="tab" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
  </div>
  <div class="ind"></div>
  <div class="lbl" id="lbl">Explorar</div>
</nav>

<script>
const posts=[
 {k:'b1',big:'2.0',cls:'',sub:'ACTUALIZACIÓN',t:'La app GioStore 2.0 llega pronto',d:'Una experiencia más fluida: navegación más rápida, vibración háptica, desplazamiento suave y modo pantalla completa.',a:'Hace 1 hora'},
 {k:'b2',big:'PRONTO',cls:'sm',sub:'JUEGOS Y MÁS',t:'Muy pronto: juegos y mucho más',d:'Estamos preparando el catálogo con los mejores juegos para que los descargues directo desde GioStore.',a:'Hace 3 horas'}
];
document.getElementById('feed').innerHTML=posts.map((p,i)=>`<article class="post" style="--i:${i}"><div class="who"><div class="av">G</div>GioStore</div><div class="ban ${p.k}"><div class="bt"><h2 class="${p.cls}">${p.big}</h2><p>${p.sub}</p></div><div class="ph"><div class="bar"></div><div class="g"><i></i><i></i><i></i><i></i></div><div class="dots"><span></span><span></span><span></span></div></div></div><h3>${p.t}</h3><p class="desc">${p.d}</p><time>${p.a}</time></article>`).join('');

const posts$=document.querySelectorAll('.post');
if('IntersectionObserver' in window){
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});
  posts$.forEach(p=>io.observe(p));
}else posts$.forEach(p=>p.classList.add('in'));

const tabs=[...document.querySelectorAll('.tab')],names=['Juegos','Novedades','Explorar','Apps','Buscar'];
const nav=document.getElementById('nav'),lbl=document.getElementById('lbl'),home=document.getElementById('home'),soon=document.getElementById('soon');
function go(i){
  tabs.forEach((t,j)=>t.classList.toggle('on',j===i));
  nav.style.setProperty('--i',i);
  lbl.textContent=names[i];lbl.classList.remove('pop');void lbl.offsetWidth;lbl.classList.add('pop');
  const h=i===2;home.hidden=!h;soon.hidden=h;
  if(!h)document.getElementById('sn').textContent=names[i];
  scrollTo({top:0});
  if(navigator.vibrate)navigator.vibrate(12);
}
tabs.forEach((t,i)=>t.addEventListener('click',()=>go(i)));

/* Web app: service worker, pantalla completa e instalación */
const standalone=matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches||navigator.standalone===true;
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(!standalone&&matchMedia('(pointer:coarse)').matches&&document.fullscreenEnabled){
  addEventListener('pointerup',()=>{
    document.documentElement.requestFullscreen({navigationUI:'hide'}).then(()=>{try{screen.orientation.lock('portrait').catch(()=>{})}catch(e){}}).catch(()=>{});
  },{once:true});
}
let dp=null;const box=document.getElementById('install'),itxt=document.getElementById('itxt'),ibtn=document.getElementById('ibtn');
const dismissed=()=>{try{return localStorage.getItem('gs-inst')==='1'}catch(e){return false}};
const showInstall=()=>{if(standalone||dismissed())return;setTimeout(()=>{box.hidden=false},2500)};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;itxt.textContent='Instala GioStore y ábrela en pantalla completa';ibtn.hidden=false;showInstall()});
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!standalone){itxt.innerHTML='Toca <b>Compartir</b> y luego <b>Añadir a pantalla de inicio</b>';ibtn.hidden=true;showInstall()}
ibtn.addEventListener('click',async()=>{if(!dp)return;dp.prompt();try{await dp.userChoice}catch(e){}dp=null;box.hidden=true});
document.getElementById('ix').addEventListener('click',()=>{box.hidden=true;try{localStorage.setItem('gs-inst','1')}catch(e){}});
addEventListener('appinstalled',()=>{box.hidden=true});
</script>
</body>
</html>
